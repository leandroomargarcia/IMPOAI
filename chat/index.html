<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IMPOAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --papel: #F1F3F0;
      --hoja: #FBFCFA;
      --franja: #E9EDEA;
      --tinta: #17212B;
      --grafito: #5E6A72;
      --tenue: #9AA4A9;
      --regla: #D3D9D4;
      --sello: #1E5AA8;
      --sello-suave: rgba(30, 90, 168, 0.08);
      --sobre-sello: #FFFFFF;
      --aviso: #9A4E17;
      --aviso-bg: #F6EDE3;
      --error: #A32D2D;
      --ok: #2E6B4F;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --papel: #151B21;
        --hoja: #1C242B;
        --franja: #222C34;
        --tinta: #E4E9EC;
        --grafito: #9AA7AF;
        --tenue: #66737B;
        --regla: #2C363E;
        --sello: #6FA3E6;
        --sello-suave: rgba(111, 163, 230, 0.12);
        --sobre-sello: #0E1620;
        --aviso: #E0A36E;
        --aviso-bg: #2A231C;
        --error: #F08A8A;
        --ok: #7CC4A0;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --papel: #151B21;
      --hoja: #1C242B;
      --franja: #222C34;
      --tinta: #E4E9EC;
      --grafito: #9AA7AF;
      --tenue: #66737B;
      --regla: #2C363E;
      --sello: #6FA3E6;
      --sello-suave: rgba(111, 163, 230, 0.12);
      --sobre-sello: #0E1620;
      --aviso: #E0A36E;
      --aviso-bg: #2A231C;
      --error: #F08A8A;
      --ok: #7CC4A0;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      background: var(--papel);
      color: var(--tinta);
    }
    button, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--sello); outline-offset: 2px; }

    .app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; height: 100dvh; }

    /* ---------- Barra lateral ---------- */
    aside {
      border-right: 1px solid var(--regla);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-height: 0;
    }
    .brand { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; padding: 0 6px; }
    .new {
      border: 1px solid var(--regla);
      background: var(--hoja);
      border-radius: 8px;
      padding: 9px 12px;
      text-align: left;
      cursor: pointer;
    }
    .new:hover { border-color: var(--sello); }
    .side-list { min-height: 0; overflow: auto; }
    .side-h { font-size: 13px; color: var(--grafito); margin: 0 6px 8px; font-weight: 500; }
    .hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .hist button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 8px 6px;
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      gap: 1px;
    }
    .hist button:hover, .hist button[aria-current="true"] { background: var(--sello-suave); }
    .hist code { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--sello); }
    .hist span { font-size: 13px; color: var(--grafito); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist .empty { font-size: 13px; color: var(--tenue); padding: 0 6px; line-height: 1.5; }
    .side-foot { margin-top: auto; display: grid; gap: 14px; }
    .side-note { margin: 0; font-size: 12.5px; color: var(--grafito); line-height: 1.5; padding: 0 6px; }
    .theme-btn {
      justify-self: start;
      border: 0;
      background: transparent;
      color: var(--grafito);
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .theme-btn:hover { color: var(--tinta); background: var(--sello-suave); }

    /* ---------- Hilo ---------- */
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .thread { flex: 1; overflow: auto; padding: 40px 24px 32px; }
    .col { max-width: 760px; margin: 0 auto; }

    .exchange + .exchange { margin-top: 56px; }
    .msg.user { display: flex; justify-content: flex-end; margin-bottom: 18px; }
    .bubble {
      background: var(--sello);
      color: var(--sobre-sello);
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      max-width: 480px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .prose { line-height: 1.6; max-width: 620px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .prose.err { color: var(--error); }

    /* Bienvenida */
    .welcome { max-width: 620px; margin: 10vh auto 0; }
    .welcome h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 10px; }
    .welcome p { color: var(--grafito); line-height: 1.55; margin: 0 0 26px; }
    .examples { display: grid; gap: 8px; }
    .examples button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: baseline;
      text-align: left;
      background: var(--hoja);
      border: 1px solid var(--regla);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .examples button:hover { border-color: var(--sello); }
    .examples strong { font-weight: 500; }
    .examples span { color: var(--grafito); font-size: 13.5px; font-variant-numeric: tabular-nums; }

    /* Estado de la respuesta */
    .status { list-style: none; margin: 0 0 14px; padding: 0 0 0 2px; font-size: 13.5px; color: var(--grafito); }
    .status li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: baseline; }
    .status li::before { content: "✓"; color: var(--ok); font-size: 12px; }
    .status li.now { color: var(--tinta); }
    .status li.now::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--sello); align-self: center; margin-left: 2px;
      animation: pulse 1.1s infinite;
    }
    .status .secs { color: var(--grafito); font-variant-numeric: tabular-nums; }
    @keyframes pulse { 50% { opacity: 0.25; } }

    /* ---------- Hoja de clasificación ---------- */
    .sheet {
      margin-top: 18px;
      background: var(--hoja);
      border: 1px solid var(--regla);
      border-radius: 10px;
      scroll-margin-top: 24px;
    }
    .msg.bot .status + .sheet { margin-top: 0; }
    .sheet section { padding: 22px 24px; }
    .sheet section + section { border-top: 1px solid var(--regla); }
    .sheet h2 { font-size: 13.5px; font-weight: 500; color: var(--grafito); margin: 0 0 10px; }

    .code {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0 0 4px;
      cursor: pointer;
      text-align: left;
    }
    .code .digits {
      font-family: "IBM Plex Mono", monospace;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      min-width: 10ch;
    }
    .code .hint {
      font-size: 12.5px;
      color: var(--grafito);
      border: 1px solid var(--regla);
      border-radius: 6px;
      padding: 3px 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .code:hover .hint, .code:focus-visible .hint, .code.copied .hint { opacity: 1; }
    .code.copied .hint { color: var(--ok); border-color: var(--ok); }
    .product { color: var(--grafito); margin: 0 0 18px; }
    .verify {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--aviso-bg);
      color: var(--aviso);
      font-size: 13.5px;
      line-height: 1.45;
    }

    .ladder { list-style: none; margin: 0; padding: 0; }
    .ladder li {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 14px;
      padding: 8px 0;
      border-top: 1px dashed var(--regla);
      line-height: 1.4;
    }
    .ladder .pfx { font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--tenue); }
    .ladder .pfx em { font-style: normal; color: var(--sello); font-weight: 500; }
    .ladder .lvl { display: block; font-size: 12.5px; color: var(--tenue); }
    .ladder li .txt { color: var(--grafito); }
    .ladder li.final {
      margin: 6px -12px 0;
      padding: 12px;
      border-top: 0;
      border-radius: 8px;
      background: var(--sello-suave);
    }
    .ladder li.final .pfx { color: var(--tinta); }
    .ladder li.final .txt { color: var(--tinta); font-weight: 500; }
    .ladder li.final .lvl { color: var(--grafito); font-weight: 400; }

    .sheet.anim .ladder li { opacity: 0; transform: translateY(4px); transition: opacity 0.35s ease, transform 0.35s ease; }
    .sheet.anim .ladder li.in { opacity: 1; transform: none; }

    .ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .ledger td { padding: 6px 0; vertical-align: baseline; }
    .ledger td.rate { color: var(--grafito); width: 70px; text-align: right; padding-right: 22px; white-space: nowrap; }
    .ledger td.amt { text-align: right; white-space: nowrap; width: 130px; }
    .ledger .rate-m { display: none; }
    .ledger tr.base td { color: var(--grafito); }
    .ledger tr.sum td { border-top: 1px solid var(--tinta); padding-top: 10px; font-weight: 600; }
    .obs { margin: 16px 0 0; padding: 0 0 0 18px; color: var(--grafito); font-size: 13px; line-height: 1.5; }
    .obs li + li { margin-top: 3px; }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 20px 24px;
      background: var(--franja);
      border-top: 1px solid var(--regla);
    }
    .total .lbl { font-weight: 500; }
    .total .lbl small { display: block; color: var(--grafito); font-weight: 400; font-size: 13px; margin-top: 2px; }
    .total .v { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .total .v small { font-size: 14px; font-weight: 500; color: var(--grafito); margin-left: 6px; }

    .note {
      margin: 0;
      padding: 14px 24px;
      background: var(--aviso-bg);
      color: var(--aviso);
      font-size: 13px;
      line-height: 1.5;
      border-top: 1px solid var(--regla);
      border-radius: 0 0 10px 10px;
    }

    /* ---------- Composer ---------- */
    .composer-wrap { position: relative; padding: 10px 24px calc(22px + env(safe-area-inset-bottom)); }
    .jump {
      position: absolute;
      left: 50%;
      top: -42px;
      transform: translateX(-50%);
      border: 1px solid var(--regla);
      background: var(--hoja);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(23, 33, 43, 0.08);
    }
    .jump:hover { border-color: var(--sello); }
    .composer {
      max-width: 760px;
      margin: 0 auto;
      background: var(--hoja);
      border: 1px solid var(--regla);
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .composer:focus-within { border-color: var(--sello); }
    .composer textarea {
      flex: 1;
      border: 0;
      resize: none;
      background: transparent;
      outline: none;
      line-height: 1.5;
      padding: 6px 0;
      max-height: 160px;
    }
    .composer textarea::placeholder { color: var(--tenue); }
    .send {
      border: 0;
      background: var(--sello);
      color: var(--sobre-sello);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .send:disabled { opacity: 0.4; cursor: default; }

    .topbar { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .status li.now::before { animation: none; }
      .sheet.anim .ladder li { transition: none; }
      .code .hint { transition: none; }
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { display: none; }
      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--regla);
      }
      .topbar .brand { margin-right: auto; }
      .topbar .new { padding: 6px 10px; }
      .thread { padding: 22px 16px 28px; }
      .composer-wrap { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--regla); background: var(--papel); }
      .welcome { margin-top: 4vh; }
      .examples button { grid-template-columns: 1fr; gap: 2px; }
      .sheet section { padding: 18px 16px; }
      .total { padding: 16px; }
      .total .v { font-size: 22px; }
      .note { padding: 12px 16px; }
      .code .digits { font-size: 32px; }
      .ladder li { grid-template-columns: 1fr; gap: 2px; }
      .ladder li.bare { grid-template-columns: 84px 1fr; gap: 10px; }
      .ladder li.final { margin: 6px -8px 0; padding: 10px 8px; }
      .ledger td.rate { display: none; }
      .ledger .rate-m { display: block; font-size: 12.5px; color: var(--grafito); }
      .ledger td { padding: 7px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">IMPOAI</div>
      <button class="new" type="button" data-new>Nueva consulta</button>
      <div class="side-list">
        <p class="side-h">NCM de esta sesión</p>
        <ul class="hist" id="hist">
          <li class="empty">Si clasificás un producto, el NCM queda acá.</li>
        </ul>
      </div>
      <div class="side-foot">
        <p class="side-note">Preguntá lo que necesites sobre importar. Clasificar NCM es una función: hace falta el producto y el CIF.</p>
        <button class="theme-btn" type="button" data-theme-btn>Tema: sistema</button>
      </div>
    </aside>

    <div class="topbar">
      <div class="brand">IMPOAI</div>
      <button class="theme-btn" type="button" data-theme-btn>Tema: sistema</button>
      <button class="new" type="button" data-new>Nueva consulta</button>
    </div>

    <main>
      <div class="thread" id="thread"><div class="col" id="col"></div></div>
      <div class="composer-wrap">
        <button class="jump" id="jump" type="button" hidden>Ver respuesta nueva</button>
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="Preguntá sobre importar, o pedí clasificar con producto y CIF" aria-label="Mensaje"></textarea>
          <button class="send" id="send" type="submit" disabled>Enviar</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const EXAMPLES = [
      { title: "¿Qué es la tasa de estadística?", meta: "Pregunta general", text: "¿Qué es la tasa de estadística y cuándo no se paga?" },
      { title: "Te ayudo con la clasificación arancelaria", meta: "Producto y CIF", text: "Ayudame con la clasificación arancelaria de un producto." },
      { title: "Te ayudo a calcular costos e impuestos", meta: "Liquidación estimada", text: "Ayudame a calcular los costos e impuestos de una importación." },
    ];
    const LEVELS = ["Capítulo", "Partida", "Subpartida", "Ítem"];
    const TAX_NAMES = {
      "DIE": "Derecho de importación",
      "Percepción IVA": "Percepción de IVA",
      "Percepción Ganancias": "Percepción de Ganancias",
      "IIBB": "Percepción de Ingresos Brutos",
    };

    const thread = document.getElementById("thread");
    const col = document.getElementById("col");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const form = document.getElementById("form");
    const jump = document.getElementById("jump");
    const hist = document.getElementById("hist");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const KEY = "impoai.session";

    // ---------- Sesión ----------
    function newSession() {
      // randomUUID solo existe en contextos seguros (https o localhost)
      const id = crypto.randomUUID
        ? crypto.randomUUID()
        : Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
      try { sessionStorage.setItem(KEY, id); } catch (e) {}
      return id;
    }
    let sessionId = null;
    try { sessionId = sessionStorage.getItem(KEY); } catch (e) {}
    if (!sessionId) sessionId = newSession();
    let busy = false;
    const history = [];

    // ---------- Formato ----------
    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    const isNum = (n) => typeof n === "number" && isFinite(n);
    const money = (n) => isNum(n)
      ? n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      : "—";
    const pct = (s) => s ? s.replace(".", ",") + " %" : "";

    // ---------- Scroll que respeta al usuario ----------
    let stick = true;
    const nearBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
    thread.addEventListener("scroll", () => {
      stick = nearBottom();
      if (stick) jump.hidden = true;
    });
    function follow() {
      if (stick) thread.scrollTop = thread.scrollHeight;
      else jump.hidden = false;
    }
    jump.addEventListener("click", () => {
      stick = true;
      thread.scrollTo({ top: thread.scrollHeight, behavior: reduce.matches ? "auto" : "smooth" });
      jump.hidden = true;
    });

    // ---------- Bienvenida ----------
    function welcome() {
      col.innerHTML = `
        <div class="welcome">
          <h1>Ayuda para tu importación</h1>
          <p>Preguntá lo que necesites: tributos, IVA, habilitación, despacho. Si querés la posición NCM y una liquidación estimada, describí el producto y el CIF.</p>
          <div class="examples">
            ${EXAMPLES.map((ex, i) => `
              <button type="button" data-ex="${i}">
                <strong>${esc(ex.title)}</strong>
                <span>${esc(ex.meta)}</span>
              </button>`).join("")}
          </div>
        </div>`;
      col.querySelectorAll("[data-ex]").forEach((b) =>
        b.addEventListener("click", () => sendMessage(EXAMPLES[+b.dataset.ex].text)));
    }

    // ---------- Desglose ----------
    // costos_asociados llega como texto, una línea por concepto. Las líneas con
    // "= N USD" (o "Concepto N USD") son tributos; el resto son datos y supuestos.
    function parseCosts(text) {
      const rows = [];
      const obs = [];
      let origen = "";
      for (const raw of String(text || "").split(/\n+/)) {
        const line = raw.trim();
        if (!line || /^CIF\s/.test(line)) continue;
        const m = line.match(/=\s*(-?[\d.]+(?:e[+-]?\d+)?)\s*USD/i)
          || line.match(/^[^\d(]+?\s(-?[\d.]+(?:e[+-]?\d+)?)\s*USD\b/i);
        if (m) {
          const name = (line.match(/^[^\d(]+/) || [line])[0].trim();
          const rate = (line.match(/(\d+(?:\.\d+)?)%/) || [])[1] || "";
          rows.push({ name: TAX_NAMES[name] || name, rate, amount: parseFloat(m[1]), detail: line });
          continue;
        }
        const o = line.match(/^Origen\s+(.+)$/);
        if (o) { origen = o[1]; continue; }
        obs.push(line);
      }
      return { rows, obs, origen };
    }

    function ladderLevels(ncm) {
      const d = String(ncm || "").replace(/\D/g, "");
      if (d.length < 8) return [[ncm, "Ítem"]];
      return [
        [d.slice(0, 2), LEVELS[0]],
        [d.slice(0, 4), LEVELS[1]],
        [`${d.slice(0, 4)}.${d.slice(4, 6)}`, LEVELS[2]],
        [`${d.slice(0, 4)}.${d.slice(4, 6)}.${d.slice(6, 8)}`, LEVELS[3]],
      ];
    }

    function ncmPath(data) {
      if (Array.isArray(data.ncm_path) && data.ncm_path.length) return data.ncm_path;
      const parts = String(data.ncm_descripcion || "").split(/\s+\/\s+/).map((s) => s.trim()).filter(Boolean);
      return ladderLevels(data.ncm).map(([code, level], i) => {
        let text = "";
        if (level === "Partida") text = parts[0] || "";
        else if (level === "Subpartida") text = (parts.length > 2 ? parts[1] : (parts[1] || "")).replace(/^[\-\s]+/, "");
        else if (level === "Ítem") text = parts[parts.length - 1] || data.ncm_descripcion || "";
        return { code, level, text };
      });
    }

    // ---------- Hoja ----------
    function sheetHtml(data) {
      const ncm = data.ncm || "—";
      const path = ncmPath(data);
      const ladder = path.map((row, i) => {
        const pfx = row.code || "";
        const prev = i ? (path[i - 1].code || "") : "";
        const head = pfx.slice(0, prev.length);
        const tail = pfx.slice(prev.length);
        const last = i === path.length - 1;
        const txt = `<span class="lvl">${esc(row.level)}</span>${esc(row.text || "—")}`;
        return `<li class="${last ? "final" : "bare"}"><span class="pfx">${esc(head)}<em>${esc(tail)}</em></span><span class="txt">${txt}</span></li>`;
      }).join("");
      const itemTxt = (path.find((r) => r.level === "Ítem") || {}).text || "";

      const costs = parseCosts(data.costos_asociados);
      const cif = data.cif;
      const tax = data.impuestos_estimados;
      const landed = isNum(cif) && isNum(tax) ? cif + tax : null;
      const rows = costs.rows.map((r) => `
        <tr title="${esc(r.detail)}">
          <td>${esc(r.name)}<span class="rate-m">${pct(r.rate)}</span></td>
          <td class="rate">${pct(r.rate)}</td>
          <td class="amt">${money(r.amount)}</td>
        </tr>`).join("");
      const obs = costs.obs.length
        ? `<ul class="obs">${costs.obs.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`
        : "";
      const verify = data.es_valido === false
        ? `<p class="verify">La verificación automática no pudo confirmar este NCM. Revisalo antes de usarlo.</p>`
        : "";
      const meaning = [itemTxt, costs.origen && `Origen ${costs.origen}`].filter(Boolean).join(" · ");
      const product = meaning ? `<p class="product">${esc(meaning)}</p>` : `<p class="product"></p>`;

      return `
        <article class="sheet">
          <section>
            <button class="code" type="button" aria-label="Copiar NCM ${esc(ncm)}">
              <span class="digits">${esc(ncm)}</span><span class="hint">Copiar</span>
            </button>
            ${product}
            ${verify}
            <ol class="ladder">${ladder}</ol>
          </section>
          <section>
            <h2>Liquidación estimada en USD</h2>
            <table class="ledger"><tbody>
              <tr class="base"><td>Valor CIF</td><td class="rate"></td><td class="amt">${money(cif)}</td></tr>
              ${rows}
              <tr class="sum"><td>Total tributos</td><td class="rate"></td><td class="amt">${money(tax)}</td></tr>
            </tbody></table>
            ${obs}
          </section>
          <div class="total">
            <div class="lbl">Costo puesto en Argentina<small>CIF + tributos</small></div>
            <div class="v">${money(landed)}<small>USD</small></div>
          </div>
          <p class="note">Es una estimación, no un despacho oficial. No incluye honorarios del despachante, gastos de terminal ni flete interno.</p>
        </article>`;
    }

    function wireCopy(sheet, ncm) {
      const btn = sheet.querySelector(".code");
      const hint = btn.querySelector(".hint");
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(ncm);
          hint.textContent = "Copiado";
        } catch (e) {
          hint.textContent = "No se pudo copiar";
        }
        btn.classList.add("copied");
        setTimeout(() => { btn.classList.remove("copied"); hint.textContent = "Copiar"; }, 1600);
      });
    }

    async function revealSheet(sheet, ncm) {
      if (reduce.matches || !ncm) return;
      sheet.classList.add("anim");
      const digits = sheet.querySelector(".digits");
      digits.textContent = "";
      for (const ch of ncm) {
        digits.textContent += ch;
        await sleep(ch === "." ? 30 : 55);
      }
      for (const li of sheet.querySelectorAll(".ladder li")) {
        li.classList.add("in");
        await sleep(160);
      }
    }

    // ---------- Historial ----------
    function exchangeEl(text) {
      const ex = document.createElement("div");
      ex.className = "exchange";
      ex.innerHTML = `<div class="msg user"><div class="bubble"></div></div><div class="msg bot"></div>`;
      ex.querySelector(".bubble").textContent = text;
      col.appendChild(ex);
      return ex;
    }

    function renderHistory() {
      if (!history.length) return;
      hist.innerHTML = history.map((h, i) => `
        <li><button type="button" data-h="${i}" aria-current="${i === 0}">
          <code>${esc(h.data.ncm || "—")}</code><span>${esc(h.ask)}</span>
        </button></li>`).join("");
      hist.querySelectorAll("[data-h]").forEach((b) => b.addEventListener("click", () => {
        const h = history[+b.dataset.h];
        hist.querySelectorAll("[data-h]").forEach((x) => x.setAttribute("aria-current", x === b));
        if (!h.sheet.isConnected) {
          col.querySelector(".welcome")?.remove();
          const ex = exchangeEl(h.ask);
          ex.querySelector(".msg.bot").insertAdjacentHTML("beforeend", sheetHtml(h.data));
          h.sheet = ex.querySelector(".sheet");
          wireCopy(h.sheet, h.data.ncm || "");
        }
        h.sheet.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" });
      }));
    }

    // ---------- SSE ----------
    async function readSSE(res, onEvent) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop() || "";
        for (const block of parts) {
          let event = "message";
          const dataLines = [];
          for (const line of block.split("\n")) {
            if (line.startsWith("event: ")) event = line.slice(7).trim();
            if (line.startsWith("data: ")) dataLines.push(line.slice(6));
          }
          if (!dataLines.length) continue;
          onEvent(event, JSON.parse(dataLines.join("\n")));
        }
      }
    }

    // ---------- Envío ----------
    async function sendMessage(text) {
      if (busy || !text) return;
      busy = true;
      send.disabled = true;
      col.querySelector(".welcome")?.remove();

      const ex = exchangeEl(text);
      const bot = ex.querySelector(".msg.bot");
      stick = true;
      follow();

      // Estado visible mientras no hay texto
      const status = document.createElement("ol");
      status.className = "status";
      status.setAttribute("role", "status");
      status.innerHTML = `<li class="now"><span>Pensando…</span></li>`;
      bot.appendChild(status);

      let prose = null;
      const showProse = () => {
        if (!prose) {
          prose = document.createElement("div");
          prose.className = "prose";
          prose.setAttribute("aria-live", "polite");
          bot.insertBefore(prose, bot.querySelector(".sheet"));
        }
        return prose;
      };
      const showError = (msg) => {
        const p = showProse();
        p.classList.add("err");
        p.textContent = msg;
      };

      // Mientras clasifica, el backend manda texto de espera y un resumen que
      // repiten lo que ya muestra la hoja: se guarda y solo se usa si no llega la hoja.
      let phase = "chat";
      let held = "";
      let timer = null;
      let started = 0;
      let gotCard = false;
      const stopTimer = () => { if (timer) clearInterval(timer); timer = null; };

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        if (!res.ok) {
          status.remove();
          showError(`El servidor respondió con un error (${res.status}). Volvé a intentar en unos segundos.`);
          return;
        }
        await readSSE(res, (event, data) => {
          if (event === "status" && data === "classifying") {
            phase = "classifying";
            started = Date.now();
            if (!status.isConnected) bot.appendChild(status);
            status.innerHTML = `<li class="now"><span>Clasificando el producto en la nomenclatura NCM <span class="secs">0 s</span></span></li>`;
            const secs = status.querySelector(".secs");
            timer = setInterval(() => {
              secs.textContent = Math.round((Date.now() - started) / 1000) + " s";
            }, 1000);
            follow();
          } else if (event === "status" && data === "collecting") {
            phase = "chat";
            held = "";
            stopTimer();
            status.remove();
          } else if (event === "token") {
            if (phase === "classifying") { held += data; return; }
            if (status.isConnected && !timer) status.remove();
            showProse().textContent += data;
            follow();
          } else if (event === "card") {
            gotCard = true;
            stopTimer();
            const secs = Math.max(1, Math.round((Date.now() - started) / 1000));
            status.innerHTML = `<li><span>Clasificado en ${secs} s</span></li>`;
            bot.insertAdjacentHTML("beforeend", sheetHtml(data));
            const sheet = bot.querySelector(".sheet");
            wireCopy(sheet, data.ncm || "");
            history.unshift({ data, ask: text, sheet });
            renderHistory();
            // Si venía siguiendo la respuesta, lo llevamos al comienzo de la hoja
            // para que vea aparecer el NCM; si había subido a leer, solo avisamos.
            if (stick) sheet.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" });
            else jump.hidden = false;
            revealSheet(sheet, data.ncm);
          } else if (event === "error") {
            stopTimer();
            status.remove();
            showError(`No se pudo completar la clasificación: ${data}`);
          }
        });
        stopTimer();
        if (!gotCard && held) {
          status.remove();
          showProse().textContent += held;
        }
        if (!gotCard && !prose) {
          status.remove();
          showError("No llegó ninguna respuesta. Volvé a intentar.");
        }
      } catch (err) {
        stopTimer();
        status.remove();
        showError("No se pudo conectar con el servidor. Revisá que la API esté corriendo y volvé a intentar.");
      } finally {
        busy = false;
        send.disabled = !input.value.trim();
        input.focus();
      }
    }

    // ---------- Composer ----------
    function grow() {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
      send.disabled = busy || !input.value.trim();
    }
    input.addEventListener("input", grow);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      grow();
      sendMessage(text);
    });

    document.querySelectorAll("[data-new]").forEach((b) => b.addEventListener("click", () => {
      if (busy) return;
      sessionId = newSession();
      welcome();
      jump.hidden = true;
      thread.scrollTop = 0;
      input.focus();
    }));

    // ---------- Tema ----------
    const THEMES = ["system", "light", "dark"];
    const THEME_LABEL = { system: "Tema: sistema", light: "Tema: claro", dark: "Tema: oscuro" };
    let theme = "system";
    try { theme = localStorage.getItem("impoai.theme") || "system"; } catch (e) {}
    if (!THEMES.includes(theme)) theme = "system";
    function applyTheme() {
      if (theme === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
      document.querySelectorAll("[data-theme-btn]").forEach((b) => (b.textContent = THEME_LABEL[theme]));
    }
    document.querySelectorAll("[data-theme-btn]").forEach((b) => b.addEventListener("click", () => {
      theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      try { localStorage.setItem("impoai.theme", theme); } catch (e) {}
      applyTheme();
    }));
    applyTheme();

    welcome();
  </script>
</body>
</html>
