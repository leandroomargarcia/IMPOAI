<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMPOAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F8F8FC;
      --bg-2: #E9E7F5;
      --ink: #26262E;
      --muted: #7A798A;
      --line: #E4E2EF;
      --line-strong: #C7C4DC;
      --card: #FFFFFF;
      --user: #6C5CE0;
      --accent: #6C5CE0;
      --ok: #1f6b5a;
      --side-ink: #26262E;
      --side-muted: #7A798A;
      --side-on: rgba(108, 92, 224, 0.12);
      --note: #FFF7E6;
      --note-ink: #B86A12;
      --err: #9b2c2c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Outfit, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100%;
    }
    aside {
      background: var(--bg-2);
      color: var(--side-ink);
      border-right: 1px solid var(--line);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .brand {
      font-size: 22px;
      letter-spacing: -0.03em;
      padding: 4px 8px;
    }
    .brand span { color: var(--accent); font-weight: 600; }
    .new {
      border: 1px solid var(--line-strong);
      background: var(--card);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      color: var(--side-ink);
      font: inherit;
    }
    .new:hover { border-color: var(--accent); }
    .convos button {
      border: 0;
      background: var(--side-on);
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--side-ink);
      font: inherit;
      width: 100%;
    }
    .side-note {
      margin-top: auto;
      font-size: 12px;
      color: var(--side-muted);
      line-height: 1.45;
      padding: 0 8px;
    }
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .thread {
      flex: 1;
      overflow: auto;
      padding: 40px 8vw 24px;
    }
    .welcome {
      max-width: 640px;
      margin: 12vh auto 0;
      text-align: center;
    }
    .welcome h1 {
      font-size: 34px;
      font-weight: 500;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }
    .welcome p { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chips button {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink);
    }
    .msg { max-width: 720px; margin: 0 auto 22px; }
    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble {
      background: var(--user);
      color: #f7f3ea;
      padding: 12px 16px;
      border-radius: 18px 18px 6px 18px;
      max-width: 520px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.bot .who {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .msg.bot .prose { line-height: 1.55; font-size: 16px; white-space: pre-wrap; }
    .msg.bot .prose.err { color: var(--err); }
    .card {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .card header {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .card header .kicker {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ok);
      font-weight: 600;
    }
    .ncm {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 28px;
      margin: 6px 0 4px;
      letter-spacing: -0.04em;
    }
    .card header .desc { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
    }
    .metrics div { background: var(--card); padding: 14px 16px; }
    .metrics dt {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .metrics dd { margin: 4px 0 0; font-size: 18px; font-weight: 600; }
    .break { padding: 16px 20px 8px; font-size: 14px; }
    .break h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .break ul { margin: 0; padding: 0 0 8px 18px; }
    .break li { margin: 4px 0; }
    .note {
      margin: 0 16px 16px;
      padding: 12px 14px;
      background: var(--note);
      border-radius: 10px;
      font-size: 13px;
      color: var(--note-ink);
      line-height: 1.45;
    }
    .wait { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .composer-wrap { padding: 12px 8vw 24px; }
    .composer {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 10px 10px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      box-shadow: 0 8px 28px rgba(40, 30, 10, 0.06);
    }
    .composer textarea {
      flex: 1;
      border: 0;
      resize: none;
      font: inherit;
      background: transparent;
      min-height: 24px;
      max-height: 120px;
      outline: none;
      color: var(--ink);
    }
    .send {
      border: 0;
      background: var(--user);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
    .send:disabled { opacity: 0.35; cursor: default; }
    .hint { max-width: 720px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      .metrics { grid-template-columns: 1fr; }
      .thread { padding: 24px 16px; }
      .composer-wrap { padding: 12px 16px 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">IMPO<span>AI</span></div>
      <button class="new" type="button" id="btn-new">Nueva conversación</button>
      <div class="convos">
        <button type="button" id="convo-label">Conversación actual</button>
      </div>
      <p class="side-note">Preguntame lo que quieras. El NCM y la liquidación salen solo si pedís clasificar (producto + CIF).</p>
    </aside>
    <main>
      <div class="thread" id="thread"></div>
      <div class="composer-wrap">
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="Producto, CIF, origen…"></textarea>
          <button class="send" type="submit" id="send" aria-label="Enviar">↑</button>
        </form>
        <p class="hint">El chat streaméa tokens. El grafo corre solo si pedís clasificar.</p>
      </div>
    </main>
  </div>
  <script>
    const thread = document.getElementById("thread");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const label = document.getElementById("convo-label");
    const KEY = "impoai.session";

    function newSession() {
      const id = crypto.randomUUID();
      sessionStorage.setItem(KEY, id);
      return id;
    }

    let sessionId = sessionStorage.getItem(KEY) || newSession();
    let busy = false;

    function usd(n) {
      if (n == null || n === "") return "—";
      return Number(n).toLocaleString("es-AR", { maximumFractionDigits: 2 }) + " USD";
    }

    function welcome() {
      thread.innerHTML = `
        <div class="welcome">
          <h1>¿En qué te ayudo?</h1>
          <p>Preguntas generales las respondo acá. Si querés un NCM y la liquidación, pedime clasificar y pasame producto + CIF.</p>
          <div class="chips">
            <button type="button" data-fill="¿Qué es el NCM?">¿Qué es el NCM?</button>
            <button type="button" data-fill="Clasificá caldera acuotubular 20 t/h origen China CIF 80000 USD">Clasificá caldera · CIF 80k</button>
          </div>
        </div>`;
      thread.querySelectorAll("[data-fill]").forEach((chip) => {
        chip.addEventListener("click", () => {
          input.value = chip.dataset.fill;
          input.focus();
        });
      });
    }

    function cardHtml(data) {
      const cif = data.cif;
      const tax = data.impuestos_estimados;
      const landed = (typeof cif === "number" && typeof tax === "number")
        ? cif + tax
        : null;
      const lines = String(data.costos_asociados || "")
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);
      const items = lines.length
        ? lines.map((line) => `<li>${escapeHtml(line)}</li>`).join("")
        : "<li>Sin desglose</li>";
      return `
        <article class="card">
          <header>
            <div class="kicker">Office · POST /run</div>
            <div class="ncm">${escapeHtml(data.ncm || "—")}</div>
            <div class="desc">${escapeHtml(data.ncm_descripcion || "")}</div>
          </header>
          <div class="metrics">
            <div><dt>CIF</dt><dd>${usd(cif)}</dd></div>
            <div><dt>Liquidación est.</dt><dd>${usd(tax)}</dd></div>
            <div><dt>CIF + derechos</dt><dd>${usd(landed)}</dd></div>
          </div>
          <div class="break">
            <h3>Desglose fiscal</h3>
            <ul>${items}</ul>
          </div>
          <p class="note">Estimación, no es un despacho AFIP / SIM / María. No incluye despachante, terminal ni flete interno.</p>
        </article>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function addUser(text) {
      const welcomeEl = thread.querySelector(".welcome");
      if (welcomeEl) welcomeEl.remove();
      const el = document.createElement("div");
      el.className = "msg user";
      el.innerHTML = `<div class="bubble"></div>`;
      el.querySelector(".bubble").textContent = text;
      thread.appendChild(el);
    }

    function addBot() {
      const el = document.createElement("div");
      el.className = "msg bot";
      el.innerHTML = `<div class="who">IMPOAI</div><div class="prose wait"><span class="dot"></span> <span class="txt"></span></div>`;
      thread.appendChild(el);
      return el;
    }

    async function readSSE(res, onEvent) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop() || "";
        for (const block of parts) {
          let event = "message";
          const dataLines = [];
          for (const line of block.split("\n")) {
            if (line.startsWith("event: ")) event = line.slice(7).trim();
            if (line.startsWith("data: ")) dataLines.push(line.slice(6));
          }
          if (!dataLines.length) continue;
          onEvent(event, JSON.parse(dataLines.join("\n")));
        }
      }
    }

    async function sendMessage(text) {
      if (busy || !text) return;
      busy = true;
      send.disabled = true;
      addUser(text);
      const bot = addBot();
      const prose = bot.querySelector(".prose");
      thread.scrollTop = thread.scrollHeight;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        if (!res.ok) {
          prose.classList.remove("wait");
          prose.classList.add("err");
          prose.textContent = "No pude hablar con el servidor.";
          return;
        }
        let started = false;
        await readSSE(res, (event, data) => {
          if (event === "status" && data === "classifying") {
            prose.className = "prose wait";
            prose.innerHTML = `<span class="dot"></span> <span class="txt"></span>`;
          }
          if (event === "token") {
            if (!started) {
              started = true;
              prose.className = "prose";
              prose.textContent = "";
            }
            prose.textContent += data;
            thread.scrollTop = thread.scrollHeight;
          }
          if (event === "card") {
            bot.insertAdjacentHTML("beforeend", cardHtml(data));
            if (data.ncm) label.textContent = data.ncm;
            thread.scrollTop = thread.scrollHeight;
          }
          if (event === "error") {
            prose.classList.remove("wait");
            prose.classList.add("err");
            prose.textContent = String(data);
          }
        });
        if (!started && !prose.textContent) {
          prose.className = "prose";
          prose.textContent = "Listo.";
        }
      } catch (err) {
        prose.className = "prose err";
        prose.textContent = "Error de red.";
      } finally {
        busy = false;
        send.disabled = false;
        input.focus();
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("form").requestSubmit();
      }
    });
    document.getElementById("btn-new").addEventListener("click", () => {
      sessionId = newSession();
      label.textContent = "Conversación actual";
      welcome();
      input.focus();
    });
    welcome();
  </script>
</body>
</html>
