<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IMPOAI mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --papel: #F1F3F0;
      --hoja: #FBFCFA;
      --franja: #E9EDEA;
      --tinta: #17212B;
      --grafito: #5E6A72;
      --tenue: #9AA4A9;
      --regla: #D3D9D4;
      --sello: #1E5AA8;
      --sello-suave: rgba(30, 90, 168, 0.08);
      --aviso: #9A4E17;
      --aviso-bg: #F6EDE3;
      --ok: #2E6B4F;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --papel: #151B21;
        --hoja: #1C242B;
        --franja: #222C34;
        --tinta: #E4E9EC;
        --grafito: #9AA7AF;
        --tenue: #66737B;
        --regla: #2C363E;
        --sello: #6FA3E6;
        --sello-suave: rgba(111, 163, 230, 0.12);
        --aviso: #E0A36E;
        --aviso-bg: #2A231C;
        --ok: #7CC4A0;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --papel: #151B21;
      --hoja: #1C242B;
      --franja: #222C34;
      --tinta: #E4E9EC;
      --grafito: #9AA7AF;
      --tenue: #66737B;
      --regla: #2C363E;
      --sello: #6FA3E6;
      --sello-suave: rgba(111, 163, 230, 0.12);
      --aviso: #E0A36E;
      --aviso-bg: #2A231C;
      --ok: #7CC4A0;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      background: var(--papel);
      color: var(--tinta);
    }
    button, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--sello); outline-offset: 2px; }

    .app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; height: 100dvh; }

    /* ---------- Barra lateral ---------- */
    aside {
      border-right: 1px solid var(--regla);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-height: 0;
    }
    .brand { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; padding: 0 6px; }
    .new {
      border: 1px solid var(--regla);
      background: var(--hoja);
      border-radius: 8px;
      padding: 9px 12px;
      text-align: left;
      cursor: pointer;
    }
    .new:hover { border-color: var(--sello); }
    .side-h { font-size: 13px; color: var(--grafito); margin: 0 6px 8px; font-weight: 500; }
    .hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .hist button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 8px 6px;
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      gap: 1px;
    }
    .hist button:hover, .hist button[aria-current="true"] { background: var(--sello-suave); }
    .hist code { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--sello); }
    .hist span { font-size: 13px; color: var(--grafito); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist .empty { font-size: 13px; color: var(--tenue); padding: 0 6px; line-height: 1.5; }
    .side-foot { margin-top: auto; display: grid; gap: 14px; }
    .side-note { margin: 0; font-size: 12.5px; color: var(--grafito); line-height: 1.5; padding: 0 6px; }
    .theme-btn {
      justify-self: start;
      border: 0;
      background: transparent;
      color: var(--grafito);
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .theme-btn:hover { color: var(--tinta); background: var(--sello-suave); }

    /* ---------- Hilo ---------- */
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .thread { flex: 1; overflow: auto; padding: 40px 24px 32px; }
    .col { max-width: 760px; margin: 0 auto; }

    .exchange + .exchange { margin-top: 56px; }
    .msg.user { display: flex; justify-content: flex-end; margin-bottom: 18px; }
    .bubble {
      background: var(--sello);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      max-width: 480px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    :root[data-theme="dark"] .bubble { color: #0E1620; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bubble { color: #0E1620; } }
    .prose { line-height: 1.6; max-width: 620px; }
    .prose p { margin: 0; }

    /* Bienvenida */
    .welcome { max-width: 620px; margin: 10vh auto 0; }
    .welcome h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 10px; }
    .welcome p { color: var(--grafito); line-height: 1.55; margin: 0 0 26px; }
    .examples { display: grid; gap: 8px; }
    .examples button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: baseline;
      text-align: left;
      background: var(--hoja);
      border: 1px solid var(--regla);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .examples button:hover { border-color: var(--sello); }
    .examples strong { font-weight: 500; }
    .examples span { color: var(--grafito); font-size: 13.5px; font-variant-numeric: tabular-nums; }

    /* Pasos del grafo */
    .steps { margin: 0 0 14px; font-size: 13.5px; color: var(--grafito); }
    .steps summary { cursor: pointer; width: fit-content; }
    .steps summary:hover { color: var(--tinta); }
    .steps.live summary { pointer-events: none; list-style: none; color: var(--tinta); }
    .steps.live summary::-webkit-details-marker { display: none; }
    .steps ol { list-style: none; margin: 10px 0 0; padding: 0 0 0 2px; display: grid; gap: 6px; }
    .steps li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: baseline; }
    .steps li::before { content: "✓"; color: var(--ok); font-size: 12px; }
    .steps li.now::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--sello); align-self: center; margin-left: 2px;
      animation: pulse 1.1s infinite;
    }
    .steps b { font-weight: 500; color: var(--tinta); }
    @keyframes pulse { 50% { opacity: 0.25; } }

    /* ---------- Hoja de clasificación ---------- */
    .sheet {
      margin-top: 18px;
      background: var(--hoja);
      border: 1px solid var(--regla);
      border-radius: 10px;
      scroll-margin-top: 24px;
    }
    .sheet section { padding: 22px 24px; }
    .sheet section + section { border-top: 1px solid var(--regla); }
    .sheet h2 { font-size: 13.5px; font-weight: 500; color: var(--grafito); margin: 0 0 10px; }

    .code {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0 0 4px;
      cursor: pointer;
      text-align: left;
    }
    .code .digits {
      font-family: "IBM Plex Mono", monospace;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      min-width: 10ch;
    }
    .code .hint {
      font-size: 12.5px;
      color: var(--grafito);
      border: 1px solid var(--regla);
      border-radius: 6px;
      padding: 3px 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .code:hover .hint, .code:focus-visible .hint, .code.copied .hint { opacity: 1; }
    .code.copied .hint { color: var(--ok); border-color: var(--ok); }
    .product { color: var(--grafito); margin: 0 0 18px; }

    .ladder { list-style: none; margin: 0; padding: 0; }
    .ladder li {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 14px;
      padding: 8px 0;
      border-top: 1px dashed var(--regla);
      line-height: 1.4;
    }
    .ladder .pfx { font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--tenue); }
    .ladder .pfx em { font-style: normal; color: var(--sello); font-weight: 500; }
    .ladder .lvl { display: block; font-size: 12.5px; color: var(--tenue); }
    .ladder li .txt { color: var(--grafito); }
    .ladder li.final {
      margin: 6px -12px 0;
      padding: 12px;
      border-top: 0;
      border-radius: 8px;
      background: var(--sello-suave);
    }
    .ladder li.final .pfx { color: var(--tinta); }
    .ladder li.final .txt { color: var(--tinta); font-weight: 500; }
    .ladder li.final .lvl { color: var(--grafito); font-weight: 400; }

    .sheet.anim .ladder li { opacity: 0; transform: translateY(4px); transition: opacity 0.35s ease, transform 0.35s ease; }
    .sheet.anim .ladder li.in { opacity: 1; transform: none; }

    .ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .ledger td { padding: 6px 0; vertical-align: baseline; }
    .ledger td.rate { color: var(--grafito); width: 70px; text-align: right; padding-right: 22px; }
    .ledger td.amt { text-align: right; white-space: nowrap; width: 130px; }
    .ledger .rate-m { display: none; }
    .ledger tr.base td { color: var(--grafito); }
    .ledger tr.sum td { border-top: 1px solid var(--tinta); padding-top: 10px; font-weight: 600; }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 20px 24px;
      background: var(--franja);
      border-top: 1px solid var(--regla);
    }
    .total .lbl { font-weight: 500; }
    .total .lbl small { display: block; color: var(--grafito); font-weight: 400; font-size: 13px; margin-top: 2px; }
    .total .v { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .total .v small { font-size: 14px; font-weight: 500; color: var(--grafito); margin-left: 6px; }

    .note {
      margin: 0;
      padding: 14px 24px;
      background: var(--aviso-bg);
      color: var(--aviso);
      font-size: 13px;
      line-height: 1.5;
      border-top: 1px solid var(--regla);
      border-radius: 0 0 10px 10px;
    }

    /* ---------- Composer ---------- */
    .composer-wrap { position: relative; padding: 10px 24px calc(22px + env(safe-area-inset-bottom)); }
    .jump {
      position: absolute;
      left: 50%;
      top: -42px;
      transform: translateX(-50%);
      border: 1px solid var(--regla);
      background: var(--hoja);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(23, 33, 43, 0.08);
    }
    .jump:hover { border-color: var(--sello); }
    .composer {
      max-width: 760px;
      margin: 0 auto;
      background: var(--hoja);
      border: 1px solid var(--regla);
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .composer:focus-within { border-color: var(--sello); }
    .composer textarea {
      flex: 1;
      border: 0;
      resize: none;
      background: transparent;
      outline: none;
      line-height: 1.5;
      padding: 6px 0;
      max-height: 160px;
    }
    .composer textarea::placeholder { color: var(--tenue); }
    .send {
      border: 0;
      background: var(--sello);
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 500;
    }
    :root[data-theme="dark"] .send { color: #0E1620; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .send { color: #0E1620; } }
    .send:disabled { opacity: 0.4; cursor: default; }

    .topbar { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .steps li.now::before { animation: none; }
      .sheet.anim .ladder li { transition: none; }
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { display: none; }
      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--regla);
      }
      .topbar .brand { margin-right: auto; }
      .topbar .new { padding: 6px 10px; }
      .thread { padding: 22px 16px 28px; }
      .composer-wrap { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--regla); background: var(--papel); }
      .welcome { margin-top: 4vh; }
      .examples button { grid-template-columns: 1fr; gap: 2px; }
      .sheet section { padding: 18px 16px; }
      .total { padding: 16px; }
      .total .v { font-size: 22px; }
      .note { padding: 12px 16px; }
      .code .digits { font-size: 32px; }
      .ladder li { grid-template-columns: 1fr; gap: 2px; }
      .ladder li.final { margin: 6px -8px 0; padding: 10px 8px; }
      .ledger td.rate { display: none; }
      .ledger .rate-m { display: block; font-size: 12.5px; color: var(--grafito); }
      .ledger td { padding: 7px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">IMPOAI</div>
      <button class="new" type="button" data-new>Nueva consulta</button>
      <div>
        <p class="side-h">Clasificados en esta sesión</p>
        <ul class="hist" id="hist">
          <li class="empty">Todavía no clasificaste nada. Los NCM que obtengas van a quedar acá.</li>
        </ul>
      </div>
      <div class="side-foot">
        <p class="side-note">Podés preguntar lo que quieras sobre importaciones. Para obtener NCM y tributos, describí el producto e indicá el valor CIF.</p>
        <button class="theme-btn" type="button" data-theme-btn>Tema: sistema</button>
      </div>
    </aside>

    <div class="topbar">
      <div class="brand">IMPOAI</div>
      <button class="theme-btn" type="button" data-theme-btn>Tema: sistema</button>
      <button class="new" type="button" data-new>Nueva consulta</button>
    </div>

    <main>
      <div class="thread" id="thread"><div class="col" id="col"></div></div>
      <div class="composer-wrap">
        <button class="jump" id="jump" type="button" hidden>Ver respuesta nueva</button>
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="Describí el producto, su origen y el valor CIF" aria-label="Mensaje"></textarea>
          <button class="send" id="send" type="submit" disabled>Enviar</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    // ---------- Datos de ejemplo (mock) ----------
    const FIXTURES = [
      {
        match: /caldera/i,
        ask: "Clasificá caldera acuotubular 20 t/h, origen China, CIF 80.000 USD",
        product: "Caldera acuotubular 20 t/h",
        origin: "China",
        cif: 80000, die: 0.14, iva: 0.105, ivaAd: 0.10,
        ncm: "8402.12.00",
        ladder: [
          ["84", "Capítulo", "Reactores nucleares, calderas, máquinas, aparatos y artefactos mecánicos"],
          ["8402", "Partida", "Calderas de vapor (generadores de vapor)"],
          ["8402.12", "Subpartida", "Calderas acuotubulares con producción de vapor inferior o igual a 45 t por hora"],
          ["8402.12.00", "Ítem", "Calderas acuotubulares hasta 45 t/h"],
        ],
        steps: ["Capítulo <b>84</b>: calderas, máquinas y aparatos mecánicos", "Partida <b>8402</b>: calderas de vapor", "Subpartida <b>8402.12</b>: acuotubulares hasta 45 t/h (20 t/h declarado)", "Precios de referencia en Argentina: 3 fuentes encontradas"],
        prose: "Una caldera acuotubular de 20 t/h entra en la subpartida 8402.12, porque su producción de vapor no supera las 45 t por hora. Como bien de capital tributa IVA reducido, y con CIF 80.000 USD de origen extrazona los tributos estimados suman unos 40.700 USD.",
      },
      {
        match: /termotanque/i,
        ask: "Termotanque eléctrico 80 L, origen China, CIF 12.000 USD",
        product: "Termotanque eléctrico 80 L",
        origin: "China",
        cif: 12000, die: 0.20, iva: 0.21, ivaAd: 0.20,
        ncm: "8516.10.00",
        ladder: [
          ["85", "Capítulo", "Máquinas, aparatos y material eléctrico, y sus partes"],
          ["8516", "Partida", "Calentadores eléctricos de agua y aparatos electrotérmicos para uso doméstico"],
          ["8516.10", "Subpartida", "Calentadores eléctricos de agua de calentamiento instantáneo o acumulación"],
          ["8516.10.00", "Ítem", "Calentadores eléctricos de agua de acumulación"],
        ],
        steps: ["Capítulo <b>85</b>: máquinas y material eléctrico", "Partida <b>8516</b>: calentadores eléctricos de agua", "Subpartida <b>8516.10</b>: de acumulación (80 L declarado)", "Precios de referencia en Argentina: 5 fuentes encontradas"],
        prose: "Un termotanque eléctrico de acumulación se clasifica en 8516.10. Es un bien de consumo, así que paga derecho de importación del 20 % e IVA general. Con CIF 12.000 USD los tributos estimados rondan los 10.000 USD.",
      },
      {
        match: /bici/i,
        ask: "Bicicletas eléctricas, origen China, CIF 25.000 USD",
        product: "Bicicletas eléctricas",
        origin: "China",
        cif: 25000, die: 0.35, iva: 0.21, ivaAd: 0.20,
        ncm: "8711.60.00",
        ladder: [
          ["87", "Capítulo", "Vehículos automóviles, tractores, velocípedos y demás vehículos terrestres"],
          ["8711", "Partida", "Motocicletas, ciclomotores y velocípedos con motor auxiliar"],
          ["8711.60", "Subpartida", "Con motor eléctrico para propulsión"],
          ["8711.60.00", "Ítem", "Velocípedos con motor eléctrico para propulsión"],
        ],
        steps: ["Capítulo <b>87</b>: vehículos terrestres", "Partida <b>8711</b>: velocípedos con motor auxiliar", "Subpartida <b>8711.60</b>: con motor eléctrico", "Precios de referencia en Argentina: 4 fuentes encontradas"],
        prose: "Las bicicletas con motor eléctrico no van en la partida de bicicletas comunes (8712), sino en 8711.60, junto a los velocípedos con motor. El derecho de importación es alto, 35 %, y con CIF 25.000 USD los tributos estimados rondan los 26.600 USD.",
      },
    ];
    const PENDING = ["Buscando capítulo…", "Buscando partida…", "Buscando subpartida…", "Buscando precios de referencia…"];

    // ---------- Estado y utilidades ----------
    const thread = document.getElementById("thread");
    const col = document.getElementById("col");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const jump = document.getElementById("jump");
    const hist = document.getElementById("hist");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const money = (n) => n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pct = (r) => (r * 100).toLocaleString("es-AR") + " %";
    let busy = false;
    const history = [];

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function taxes(fx) {
      const die = fx.cif * fx.die;
      const te = fx.cif * 0.03;
      const base = fx.cif + die + te;
      const rows = [
        ["Derecho de importación", fx.die, die],
        ["Tasa de estadística", 0.03, te],
        ["IVA", fx.iva, base * fx.iva],
        ["IVA adicional", fx.ivaAd, base * fx.ivaAd],
        ["Percepción de Ganancias", 0.06, base * 0.06],
        ["Percepción de Ingresos Brutos", 0.025, base * 0.025],
      ];
      const total = rows.reduce((s, r) => s + r[2], 0);
      return { rows, total, landed: fx.cif + total };
    }

    // ---------- Scroll que respeta al usuario ----------
    let stick = true;
    const nearBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
    thread.addEventListener("scroll", () => {
      stick = nearBottom();
      if (stick) jump.hidden = true;
    });
    function follow() {
      if (stick) thread.scrollTop = thread.scrollHeight;
      else jump.hidden = false;
    }
    jump.addEventListener("click", () => {
      stick = true;
      thread.scrollTo({ top: thread.scrollHeight, behavior: reduce.matches ? "auto" : "smooth" });
      jump.hidden = true;
    });

    // ---------- Bienvenida ----------
    function welcome() {
      col.innerHTML = `
        <div class="welcome">
          <h1>Clasificá una importación</h1>
          <p>Describí el producto, de dónde viene y su valor CIF. Te devuelvo el NCM con el recorrido de la clasificación y una estimación de tributos. También podés hacer preguntas generales sobre importar.</p>
          <div class="examples">
            ${FIXTURES.map((fx, i) => `
              <button type="button" data-ex="${i}">
                <strong>${esc(fx.product)}</strong>
                <span>${esc(fx.origin)}, CIF ${fx.cif.toLocaleString("es-AR")} USD</span>
              </button>`).join("")}
          </div>
        </div>`;
      col.querySelectorAll("[data-ex]").forEach((b) =>
        b.addEventListener("click", () => ask(FIXTURES[+b.dataset.ex].ask)));
    }

    // ---------- Hoja ----------
    function sheetHtml(fx) {
      const t = taxes(fx);
      const ladder = fx.ladder.map(([pfx, lvl, txt], i) => {
        const prev = i ? fx.ladder[i - 1][0] : "";
        const head = pfx.slice(0, prev.length);
        const tail = pfx.slice(prev.length);
        const last = i === fx.ladder.length - 1;
        return `<li class="${last ? "final" : ""}"><span class="pfx">${head}<em>${tail}</em></span><span class="txt"><span class="lvl">${lvl}</span>${esc(txt)}</span></li>`;
      }).join("");
      const rows = t.rows.map(([name, rate, amt]) =>
        `<tr><td>${name}<span class="rate-m">${pct(rate)}</span></td><td class="rate">${pct(rate)}</td><td class="amt">${money(amt)}</td></tr>`).join("");
      return `
        <article class="sheet">
          <section>
            <button class="code" type="button" aria-label="Copiar NCM ${fx.ncm}">
              <span class="digits">${fx.ncm}</span><span class="hint">Copiar</span>
            </button>
            <p class="product">${esc(fx.product)}, origen ${esc(fx.origin)}</p>
            <ol class="ladder">${ladder}</ol>
          </section>
          <section>
            <h2>Liquidación estimada en USD</h2>
            <table class="ledger"><tbody>
              <tr class="base"><td>Valor CIF</td><td class="rate"></td><td class="amt">${money(fx.cif)}</td></tr>
              ${rows}
              <tr class="sum"><td>Total tributos</td><td class="rate"></td><td class="amt">${money(t.total)}</td></tr>
            </tbody></table>
          </section>
          <div class="total">
            <div class="lbl">Costo puesto en Argentina<small>CIF + tributos</small></div>
            <div class="v">${money(t.landed)}<small>USD</small></div>
          </div>
          <p class="note">Es una estimación, no un despacho oficial. No incluye honorarios del despachante, gastos de terminal ni flete interno. Las percepciones de IVA adicional, Ganancias e IIBB pueden computarse como pago a cuenta.</p>
        </article>`;
    }

    function wireCopy(sheet, ncm) {
      const btn = sheet.querySelector(".code");
      const hint = btn.querySelector(".hint");
      btn.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(ncm); } catch (e) {}
        btn.classList.add("copied");
        hint.textContent = "Copiado";
        setTimeout(() => { btn.classList.remove("copied"); hint.textContent = "Copiar"; }, 1600);
      });
    }

    async function revealSheet(sheet, ncm) {
      if (reduce.matches) return;
      sheet.classList.add("anim");
      const digits = sheet.querySelector(".digits");
      digits.textContent = "";
      for (const ch of ncm) {
        digits.textContent += ch;
        await sleep(ch === "." ? 30 : 55);
      }
      const items = sheet.querySelectorAll(".ladder li");
      for (const li of items) {
        li.classList.add("in");
        await sleep(160);
      }
    }

    // ---------- Historial ----------
    function renderHistory() {
      if (!history.length) return;
      hist.innerHTML = history.map((h, i) => `
        <li><button type="button" data-h="${i}" aria-current="${i === 0}">
          <code>${h.fx.ncm}</code><span>${esc(h.fx.product)}</span>
        </button></li>`).join("");
      hist.querySelectorAll("[data-h]").forEach((b) => b.addEventListener("click", () => {
        const h = history[+b.dataset.h];
        hist.querySelectorAll("[data-h]").forEach((x) => x.setAttribute("aria-current", x === b));
        if (!h.sheet.isConnected) {
          col.querySelector(".welcome")?.remove();
          const ex = document.createElement("div");
          ex.className = "exchange";
          ex.innerHTML = `<div class="msg user"><div class="bubble"></div></div><div class="msg bot"></div>`;
          ex.querySelector(".bubble").textContent = h.fx.ask;
          ex.querySelector(".msg.bot").insertAdjacentHTML("beforeend", sheetHtml(h.fx));
          col.appendChild(ex);
          h.sheet = ex.querySelector(".sheet");
          wireCopy(h.sheet, h.fx.ncm);
        }
        h.sheet.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" });
      }));
    }

    // ---------- Flujo simulado ----------
    async function streamInto(el, text) {
      const words = text.split(/(\s+)/);
      for (const w of words) {
        el.textContent += w;
        follow();
        await sleep(reduce.matches ? 0 : 22);
      }
    }

    async function ask(text) {
      if (busy || !text) return;
      busy = true;
      send.disabled = true;
      col.querySelector(".welcome")?.remove();
      const fx = FIXTURES.find((f) => f.match.test(text));

      const ex = document.createElement("div");
      ex.className = "exchange";
      ex.innerHTML = `<div class="msg user"><div class="bubble"></div></div><div class="msg bot"></div>`;
      ex.querySelector(".bubble").textContent = text;
      col.appendChild(ex);
      const bot = ex.querySelector(".msg.bot");
      stick = true;
      follow();

      if (!fx) {
        const p = document.createElement("div");
        p.className = "prose";
        p.setAttribute("aria-live", "polite");
        bot.appendChild(p);
        await sleep(400);
        await streamInto(p, "Este mock solo tiene respuestas para tres ejemplos: caldera acuotubular, termotanque eléctrico y bicicletas eléctricas. Probá con alguno de ellos para ver la hoja de clasificación.");
        busy = false;
        return;
      }

      // Pasos en vivo
      const steps = document.createElement("details");
      steps.className = "steps live";
      steps.open = true;
      steps.innerHTML = `<summary>Clasificando…</summary><ol role="status"></ol>`;
      bot.appendChild(steps);
      const ol = steps.querySelector("ol");
      for (let i = 0; i < fx.steps.length; i++) {
        const li = document.createElement("li");
        li.className = "now";
        li.innerHTML = `<span>${PENDING[i]}</span>`;
        ol.appendChild(li);
        follow();
        await sleep(750);
        li.className = "";
        li.innerHTML = `<span>${fx.steps[i]}</span>`;
      }
      await sleep(300);
      // Se pliegan en el desplegable
      steps.classList.remove("live");
      steps.querySelector("summary").textContent = `Cómo llegué a este NCM (${fx.steps.length} pasos)`;
      steps.open = false;

      // Texto
      const prose = document.createElement("div");
      prose.className = "prose";
      prose.setAttribute("aria-live", "polite");
      bot.appendChild(prose);
      await streamInto(prose, fx.prose);

      // Hoja
      bot.insertAdjacentHTML("beforeend", sheetHtml(fx));
      const sheet = bot.querySelector(".sheet");
      wireCopy(sheet, fx.ncm);
      history.unshift({ fx, sheet });
      renderHistory();
      // Si el usuario venía siguiendo la respuesta, lo llevamos al comienzo de la hoja
      // para que vea aparecer el NCM; si había subido a leer, solo avisamos.
      if (stick) sheet.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" });
      else jump.hidden = false;
      await revealSheet(sheet, fx.ncm);
      busy = false;
      send.disabled = !input.value.trim();
    }

    // ---------- Composer ----------
    function grow() {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
      send.disabled = busy || !input.value.trim();
    }
    input.addEventListener("input", grow);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("form").requestSubmit();
      }
    });
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      grow();
      ask(text);
    });

    document.querySelectorAll("[data-new]").forEach((b) => b.addEventListener("click", () => {
      if (busy) return;
      welcome();
      jump.hidden = true;
      thread.scrollTop = 0;
      input.focus();
    }));

    // ---------- Tema ----------
    const THEMES = ["system", "light", "dark"];
    const THEME_LABEL = { system: "Tema: sistema", light: "Tema: claro", dark: "Tema: oscuro" };
    let theme = "system";
    try { theme = localStorage.getItem("impoai.theme") || "system"; } catch (e) {}
    function applyTheme() {
      if (theme === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
      document.querySelectorAll("[data-theme-btn]").forEach((b) => (b.textContent = THEME_LABEL[theme]));
    }
    document.querySelectorAll("[data-theme-btn]").forEach((b) => b.addEventListener("click", () => {
      theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      try { localStorage.setItem("impoai.theme", theme); } catch (e) {}
      applyTheme();
    }));
    applyTheme();

    welcome();
  </script>
</body>
</html>
