<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMPOAI — mock chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F8F8FC;
      --bg-2: #E9E7F5;
      --ink: #26262E;
      --muted: #7A798A;
      --line: #E4E2EF;
      --line-strong: #C7C4DC;
      --card: #FFFFFF;
      --user: #6C5CE0;
      --accent: #6C5CE0;
      --ok: #1f6b5a;
      --side-ink: #26262E;
      --side-muted: #7A798A;
      --side-on: rgba(108, 92, 224, 0.12);
      --note: #FFF7E6;
      --note-ink: #B86A12;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Outfit, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100%;
    }
    aside {
      background: var(--bg-2);
      color: var(--side-ink);
      border-right: 1px solid var(--line);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .brand {
      font-family: Outfit, "Segoe UI", system-ui, sans-serif;
      font-size: 22px;
      letter-spacing: -0.03em;
      padding: 4px 8px;
    }
    .brand span { color: var(--accent); font-weight: 600; }
    .new {
      border: 1px solid var(--line-strong);
      background: var(--card);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      color: var(--side-ink);
      font: inherit;
    }
    .new:hover { border-color: var(--accent); }
    .convos { display: flex; flex-direction: column; gap: 4px; }
    .convos button {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--side-muted);
      font: inherit;
      cursor: pointer;
    }
    .convos button.on, .convos button:hover {
      background: var(--side-on);
      color: var(--side-ink);
    }
    .scenes {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .scenes p {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--side-muted);
    }
    .scenes button {
      display: block;
      width: 100%;
      margin-bottom: 6px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      color: var(--side-ink);
      cursor: pointer;
    }
    .scenes button.on { background: var(--side-on); }
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 12px 8vw 0;
    }
    .bar button {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
    }
    .bar button.on { color: var(--accent); border-color: var(--accent); background: var(--side-on); }
    .thread {
      flex: 1;
      overflow: auto;
      padding: 40px 8vw 24px;
    }
    .welcome {
      max-width: 640px;
      margin: 12vh auto 0;
      text-align: center;
    }
    .welcome h1 {
      font-family: Outfit, "Segoe UI", system-ui, sans-serif;
      font-size: 34px;
      font-weight: 500;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }
    .welcome p { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chips button {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink);
    }
    .msg {
      max-width: 720px;
      margin: 0 auto 22px;
    }
    .msg.user {
      display: flex;
      justify-content: flex-end;
    }
    .msg.user .bubble {
      background: var(--user);
      color: #f7f3ea;
      padding: 12px 16px;
      border-radius: 18px 18px 6px 18px;
      max-width: 520px;
      line-height: 1.45;
    }
    .msg.bot .who {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .msg.bot .prose {
      line-height: 1.55;
      font-size: 16px;
    }
    .card {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .card header {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .card header .kicker {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ok);
      font-weight: 600;
    }
    .ncm {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 28px;
      margin: 6px 0 4px;
      letter-spacing: -0.04em;
    }
    .card header .desc { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
    }
    .metrics div {
      background: var(--card);
      padding: 14px 16px;
    }
    .metrics dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .metrics dd { margin: 4px 0 0; font-size: 18px; font-weight: 600; }
    .break {
      padding: 16px 20px 8px;
      font-size: 14px;
    }
    .break h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .break ul { margin: 0; padding: 0 0 8px 18px; color: var(--ink); }
    .break li { margin: 4px 0; }
    .note {
      margin: 0 16px 16px;
      padding: 12px 14px;
      background: var(--note);
      border-radius: 10px;
      font-size: 13px;
      color: var(--note-ink);
      line-height: 1.45;
    }
    .wait {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .composer-wrap {
      padding: 12px 8vw 24px;
    }
    .composer {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 10px 10px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      box-shadow: 0 8px 28px rgba(40, 30, 10, 0.06);
    }
    .composer textarea {
      flex: 1;
      border: 0;
      resize: none;
      font: inherit;
      background: transparent;
      min-height: 24px;
      max-height: 120px;
      outline: none;
      color: var(--ink);
    }
    .send {
      border: 0;
      background: var(--user);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
    .send:disabled { opacity: 0.35; cursor: default; }
    .hint { max-width: 720px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      .metrics { grid-template-columns: 1fr; }
      .thread { padding: 24px 16px; }
      .composer-wrap { padding: 12px 16px 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">IMPO<span>AI</span></div>
      <button class="new" type="button" id="btn-new">Nueva conversación</button>
      <div class="convos">
        <button type="button" class="on">Caldera · China · CIF 80k</button>
        <button type="button">Ibuprofeno 400 mg</button>
      </div>
      <div class="scenes">
        <p>Escenas del mock</p>
        <button type="button" data-scene="empty" class="on">1 · Vacío</button>
        <button type="button" data-scene="slots">2 · Pide CIF</button>
        <button type="button" data-scene="wait">3 · Clasificando</button>
        <button type="button" data-scene="report">4 · Informe</button>
      </div>
    </aside>
    <main>
      <div class="bar" id="bar">
        <button type="button" data-scene="empty" class="on">Vacío</button>
        <button type="button" data-scene="slots">Pide CIF</button>
        <button type="button" data-scene="wait">Clasificando</button>
        <button type="button" data-scene="report">Informe</button>
      </div>
      <div class="thread" id="thread"></div>
      <div class="composer-wrap">
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="Producto, CIF, origen…"></textarea>
          <button class="send" type="submit" aria-label="Enviar">↑</button>
        </form>
        <p class="hint">Mock estático. En prod el chat streaméa tokens; POST /run es un JSON (async, sin stream).</p>
      </div>
    </main>
  </div>
  <script>
    const thread = document.getElementById("thread");
    const input = document.getElementById("input");
    const scenes = document.querySelectorAll("[data-scene]");

    const reportCard = `
      <article class="card">
        <header>
          <div class="kicker">Office · POST /run</div>
          <div class="ncm">8402.12.00</div>
          <div class="desc">Calderas acuotubulares con producción de vapor ≤ 45 t/h · AEC 12,6 % BK</div>
        </header>
        <div class="metrics">
          <div><dt>CIF</dt><dd>80.000 USD</dd></div>
          <div><dt>Liquidación est.</dt><dd>41.611 USD</dd></div>
          <div><dt>CIF + derechos</dt><dd>121.611 USD</dd></div>
        </div>
        <div class="break">
          <h3>Desglose fiscal</h3>
          <ul>
            <li>DIE 12,6 % = 10.080</li>
            <li>Tasa estadística 3 % = 2.400</li>
            <li>IVA 10,5 % (BK) = 9.710</li>
            <li>Perc. IVA 10 % = 9.248 · Ganancias 11 % = 10.173</li>
            <li>IIBB 0 (falta provincia)</li>
          </ul>
        </div>
        <p class="note">Estimación, no es un despacho AFIP / SIM / María. No incluye despachante, terminal ni flete interno.</p>
      </article>`;

    const views = {
      empty: `
        <div class="welcome">
          <h1>¿Qué vas a importar?</h1>
          <p>Pedime una clasificación NCM y una liquidación fiscal. Necesito el producto y el CIF en USD.</p>
          <div class="chips">
            <button type="button" data-fill="Caldera acuotubular 20 t/h origen China">Caldera 20 t/h · China</button>
            <button type="button" data-fill="Ibuprofeno 400 mg CIF 4 USD">Ibuprofeno 400 mg</button>
          </div>
        </div>`,
      slots: `
        <div class="msg user"><div class="bubble">Quiero importar una caldera acuotubular de vapor 20 toneladas por hora, origen China.</div></div>
        <div class="msg bot">
          <div class="who">IMPOAI</div>
          <div class="prose">Puedo clasificarla y estimar derechos. Para liquidar necesito el <strong>CIF en USD</strong>. ¿Lo tenés? Si sos responsable inscripto o hay provincia para IIBB, decime también.</div>
        </div>`,
      wait: `
        <div class="msg user"><div class="bubble">CIF 80.000 USD, monotributista, sin provincia.</div></div>
        <div class="msg bot">
          <div class="who">IMPOAI</div>
          <div class="prose wait"><span class="dot"></span> Clasificando… llamo al office (POST /run). Esto tarda unos segundos.</div>
        </div>`,
      report: `
        <div class="msg user"><div class="bubble">CIF 80.000 USD, monotributista, sin provincia.</div></div>
        <div class="msg bot">
          <div class="who">IMPOAI</div>
          <div class="prose">Listo. El office devolvió NCM <strong>8402.12.00</strong> (caldera acuotubular ≤ 45 t/h). Liquidación estimada <strong>41.611 USD</strong> sobre CIF 80.000. Falta provincia, así que IIBB quedó en 0.</div>
          ${reportCard}
        </div>`,
    };

    function show(name) {
      thread.innerHTML = views[name];
      scenes.forEach((b) => b.classList.toggle("on", b.dataset.scene === name));
      thread.querySelectorAll("[data-fill]").forEach((chip) => {
        chip.addEventListener("click", () => {
          input.value = chip.dataset.fill;
          input.focus();
        });
      });
    }

    scenes.forEach((b) => b.addEventListener("click", () => show(b.dataset.scene)));
    document.getElementById("btn-new").addEventListener("click", () => show("empty"));
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = "";
      if (/cif|80/i.test(t)) show("report");
      else if (/caldera|ibupro/i.test(t)) show("slots");
      else show("wait");
    });
    show("empty");
  </script>
</body>
</html>
