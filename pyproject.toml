[project]
name = "impoai"
version = "0.1.0"
description = "LangGraph assistant for Mercosur NCM classification, reference pricing, AEC duty estimates, and Argentina import permits."
readme = "README.md"
authors = [
    { name = "Leandro Garcia", email = "leomniga@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.0.0",
    "langfuse>=3.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0"
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
