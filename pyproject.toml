[project]
name = "impoai"
version = "0.1.0"
description = "LangGraph assistant for Mercosur NCM classification, reference pricing, AEC duty estimates, and Argentina import permits."
readme = "README.md"
authors = [
    { name = "Leandro Garcia", email = "leandro.garcia@fiadoapp.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
